name: tests

on:
  push:
    branches:
      - dev
      - main
      - releasing/*
  pull_request:
    branches:
      - dev
      - main
      - releasing/*
  # schedule:
  #   - cron: "0 2 * * 3"  # at 02:00 UTC Wednesday
  # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

permissions:
  contents: read

concurrency:
  # automatically cancel the previously triggered workflows when there's a newer version
  group: cicd-tests-gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Supported versions of Python and PyTorch are listed here for use below and as documentation
env:
  # supported versions of Python
  PYTHON_VER1: '3.11'
  PYTHON_VER2: '3.12'
  PYTHON_VER3: '3.13'
  # PYTHON_VER4: '3.14'  # TODO: not compatible with Torchscript, re-enable once Torchscript removed from MONAI
  # PYTHON_VER5: '3.15'
  # supported versions of PyTorch
  PYTORCH_VER1: '2.12.1'
  PYTORCH_VER2: '2.13.0'
  PYTORCH_VER3: '2.14.1'
  PYTORCH_VER4: '2.15.0'
  TORCHVISION_VER1: '0.27.1'  # used for testing with lowest PyTorch version (PYTORCH_VER1), update as needed

  TQDM_DISABLE: 1  # squelch TQDM output to reduce log file size

  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python  # https://github.com/Project-MONAI/MONAI/issues/4354

  BUILD_MONAI: 1  # always build MONAI and ensure it tries to use the compiled extensions
  FORCE_CUDA: 1  # ensure CUDA code is built
  CUDA_HOME: '/usr/local/cuda'  # ensure the CUDA directory is definitely found
  TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 8.9 9.0+PTX 12.0"  # specify supported architectures

jobs:

  full-dep-gpu: 
    runs-on: [self-hosted, linux, gpu]
    strategy:
      fail-fast: false
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ env.PYTHON_VER1 }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VER1 }}
        cache: 'pip'
    - name: Install CUDA
      run: |
        sudo apt update
        sudo apt upgrade -y
        sudo apt install --no-install-recommends -y ca-certificates git wget
        wget https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt update
        sudo apt install --no-install-recommends -y cuda-toolkit-13-3
      env:
        DEBIAN_FRONTEND: 'noninteractive'
    - name: Install the complete dependencies
      run: |
        python -m pip install --upgrade pip wheel wheel_stub
        python -m pip install torch==${PYTORCH_VER1} torchvision==${TORCHVISION_VER1}
        python -m pip install --pre -U itk  # TODO: needed?
        python monai/config/print_dependencies.py build-system | xargs pip install --no-build-isolation
        # tests below use the MONAI in the current directory, -e ensures the compiled code stays there and is found
        python -m pip install --no-build-isolation -e .[all,testing,nvimgcodec]
      shell: bash
    - name: Run (almost) all tests
      run: |
        python -c 'import monai._C; cap=monai._C.max_compute_capability(); assert cap > 0, f"Capabilities too low: {cap}"'
        nvidia-smi || true
        python monai/config/check_env.py --env --monai
        ./runtests.sh -u --net
      # env:  # FIXME: NGC test failing with "RuntimeError: NGC API response is not ok. Failed to get token." Need to fix key?
      #   NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
      #   NGC_ORG: ${{ secrets.NGC_ORG }}
      #   NGC_TEAM: ${{ secrets.NGC_TEAM }}

  full-dep-gpu-hyena: 
    runs-on: [self-hosted, linux, gpu] 
    strategy:
      fail-fast: false
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ env.PYTHON_VER1 }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VER1 }}
        cache: 'pip'
    - name: Install CUDA
      run: |
        sudo apt update
        sudo apt upgrade -y
        sudo apt install --no-install-recommends -y ca-certificates git wget
        wget https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt update
        sudo apt install --no-install-recommends -y cuda-toolkit-13-3
      env:
        DEBIAN_FRONTEND: 'noninteractive'
    - name: Install the complete dependencies
      run: |
        python -m pip install --upgrade pip wheel wheel_stub
        python -m pip install torch==${PYTORCH_VER3} torchvision
        python monai/config/print_dependencies.py build-system | xargs pip install --no-build-isolation
        # tests below use the MONAI in the current directory, -e ensures the compiled code stays there and is found
        python -m pip install --no-build-isolation -e .[testing,hyena]
      shell: bash
    - name: Run Hyena tests
      run: |
        python -c "from monai.networks.blocks.hyena import is_nvsubquadratic_available; \
                   assert is_nvsubquadratic_available(), 'nvsubquadratic must be importable'"
        python -m unittest tests.networks.blocks.test_hyena_block tests.networks.nets.test_hyena_nd_unetr tests.networks.nets.test_swin_unetr
