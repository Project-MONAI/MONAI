
name: nightly-crons

on:
  schedule:
    - cron: "0 2 * * *"  # at 02:00 UTC
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # automatically cancel the previously triggered workflows when there's a newer version
  group: bundle-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # supported versions of Python, copied from ci_tests.yml and should be synced where appropriate with that file
  PYTHON_VER1: '3.11'
  PYTORCH_VER1: '2.12.1'
  TORCHVISION_VER1: '0.27.1'  # used for testing with lowest PyTorch version (PYTORCH_VER1), update as needed

  TQDM_DISABLE: 1  # squelch TQDM output to reduce log file size

  PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python  # https://github.com/Project-MONAI/MONAI/issues/4354

  PIP_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"  # forces CPU PyTorch installation, should be faster

jobs:
  cron-ngc-load:
    if: github.repository == 'Project-MONAI/MONAI'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ env.PYTHON_VER1 }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ env.PYTHON_VER1 }}
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install -U pip wheel wheel-stub
        python -m pip install torch==$PYTORCH_VER1
        python monai/config/print_dependencies.py build-system | xargs pip install --no-build-isolation
        python -m pip install --no-build-isolation .[all,testing]
    - name: Loading Bundles
      run: |
        # clean up temporary files
        rm -rf /github/home/.cache/torch/hub/bundle/
        $(pwd)/runtests.sh --build --clean
        # run tests
        PYTHONPATH=. python -m unittest tests.bundle.test_bundle_download.TestNgcBundleDownload

  cron-conda:
    if: github.repository == 'Project-MONAI/MONAI'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest,windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 46 # equal to max + 3*std over the last 600 successful runs

    steps:
    - if: runner.os == 'windows'
      name: Config pagefile (Windows only)
      uses: al-cheb/configure-pagefile-action@v1.5
      with:
        minimum-size: 8GB
        maximum-size: 16GB
        disk-root: "D:"
    - uses: actions/checkout@v7
    - if: runner.os == 'linux'
      name: Clean up disk space
      shell: bash -el {0}
      run: |
        find /opt/hostedtoolcache/* -maxdepth 0 ! -name 'Python' -exec rm -rf {} \;
        rm -rf /usr/share/dotnet/
    - uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        auto-activate: false
        environment-file: environment-dev.yml
        activate-environment: monai
    - name: Test env (${{ runner.os }})
      shell: bash -el {0}
      env:
        NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        NGC_ORG: ${{ secrets.NGC_ORG }}
        NGC_TEAM: ${{ secrets.NGC_TEAM }}
        QUICKTEST: True
      run: |
        conda info
        conda list
        ./runtests.sh --build --unittests
